name: fetch-media
# Downloads image URLs listed in media/ugc/fetch.txt into media/ugc/raw/ (used for social media assets).
on:
  push:
    paths: ['media/ugc/fetch.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p media/ugc/raw
          while read -r u; do
            [ -z "$u" ] && continue
            f="media/ugc/raw/$(basename "$u")"
            [ -f "$f" ] || curl -sSfL "$u" -o "$f"
          done < media/ugc/fetch.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media/ugc/raw
          git diff --cached --quiet || (git commit -m "Fetch UGC media" && git push)
